services:
  - type: web
    name: resolve-probe
    # Docker, not the native Go runtime: the GO_VERSION env var is advisory and
    # Render ignored it (it built with 1.27.1). The Dockerfile pins golang:1.19,
    # which is what build/ci/Dockerfile.jenkins uses for taskrouter, so the TLS
    # ClientHello this probe sends matches the one staging sends.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: TARGET_URL
        value: https://www.tui.se/cdn/media/sys_master/h07/h51/15866047922206/740-425-RIU-TUI-walk-to-beach.jpg
